# EndGrid iQTV+ settings. build.sh copies this file to config.properties the first time; edit that one and rebuild.
# Most of these can also be changed on the TV (EndGrid iQTV+ › Personalize and Home Settings); the TV's choice wins.

# Free key from https://www.themoviedb.org/settings/api (the "API Read Access Token" or the "API Key").
# Without it, the home screen still works (your apps, Continue Watching, search needs it), just without the picks.
tmdb_key=

# Your country (two letters): decides which titles are on which streaming app. IN, US, GB, CA, BR, DE, FR...
tmdb_region=US

# Optional: picks only of titles first made in these languages, TMDB's two-letter codes, comma separated:
# ta (Tamil), te, ml, hi, ko, ja... Empty = any language.
content_language=

# Optional: your name, for your initial at the top and "Recommended for <name>".
viewer_name=

# The home screen: topshelf (EndGrid iQTV+'s cinematic home) or cards (a simpler one with three picks).
design=topshelf

# Your city, for the weather and the sunset that turns the screen dark at night (decimal degrees).
latitude=40.7128
longitude=-74.0060
# Optional: the name shown on the weather card (empty = "Weather").
city=

# true leaves cartoons and anime (TMDB's Animation genre) out of the picks.
hide_animation=false

# auto (follows the TV), or a language in app/assets/i18n (en, pt, es, de, ru, fr, ja, zh-CN…)
language=auto

# C, F, or auto (Fahrenheit when the TV is set to the US)
temperature=auto

# true also turns off Google Assistant ("Ok Google"); the remote's mic button stops working
disable_assistant=false

# Streaming services to leave out of the picks even when their app is on the TV, comma separated:
# netflix, prime, disney, hulu, paramount, peacock, max, appletv, hotstar, zee5, crunchyroll...
# For apps the TV ships that you don't subscribe to.
hide_services=

# Optional: a free Watchmode key (watchmode.com) makes a title open its own page in its app (Prime Video,
# JioHotstar...), not just the app. Without it, it opens the app. Keep it private.
watchmode_key=
