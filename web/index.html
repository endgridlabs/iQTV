<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<title>EndGrid iQTV+</title>
<link rel="stylesheet" href="home.css">
</head>
<body>
<div id="stage">
  <div id="sky">
    <div class="photo" id="photoA"></div>
    <div class="photo" id="photoB"></div>
    <div class="scrim"></div>
  </div>
  <div id="hero">
    <div id="clockHero"><div class="time"></div><div class="date"></div><div class="hint"></div></div>
    <div id="heroText">
      <div class="label"></div>
      <div class="title"><img class="logo" alt=""><span class="name"></span></div>
      <div class="meta"></div>
      <div class="overview"></div>
    </div>
    <div id="actions"></div>
    <div id="dots"></div>
  </div>
  <div id="stack"></div>
  <div id="bar">
    <div id="brand"><span class="iq">iQ</span><span class="tv">TV+</span></div>
    <div id="nav"></div>
    <div id="corner"><span id="avatar"></span><span id="clock"></span></div>
  </div>
  <div id="info" class="overlay"><div class="panel"></div></div>
  <div id="apps" class="overlay sheet"><div class="box"><h2></h2><div class="scroll"></div></div></div>
  <div id="search" class="overlay sheet"><div class="box"><h2></h2><input type="text" autocomplete="off"><p class="note"></p></div></div>
  <div id="settings" class="overlay sheet"><div class="box"><h2></h2><div class="list"></div></div></div>
  <div id="toast"></div>
</div>
<script src="config.js"></script>
<script src="i18n.js"></script>
<script src="strings.js"></script>
<script src="tv.js"></script>
<script src="data.js"></script>
<script src="home.js"></script>
</body>
</html>
